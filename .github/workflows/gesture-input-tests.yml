name: Gesture input instrumented tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gesture-tests:
    name: GestureReleaseInstrumentedTest (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 手势单测不依赖地图追踪资源，构建精简版即可，省掉 NDK 与 185 MiB 地图资源。
      - name: Build debug and androidTest APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PincludePathing=false --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented gesture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest -PincludePathing=false -Pandroid.testInstrumentationRunnerArguments.class=com.bettergi.pocket.input.GestureReleaseInstrumentedTest --console=plain
